name: Playwright Tests with Automated Reporting
on:
  push:
    branches: [ main, master, dev, feature/* ] # 💡 Monitor changes on all development branches
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 💡 Strategy 1: If the triggering event pushes to the main branch, execute a full regression test.
    - name: Run Full Regression Tests (Main Branch Only)
      if: github.ref == 'refs/heads/main'
      run: npx playwright test --grep @regression

    # 💡 Strategy 2: For other development branches (such as dev, feature) or pull requests, only run quick smoke tests.
    - name: Run Quick Smoke Tests (Dev Branches / PRs)
      if: github.ref != 'refs/heads/main'
      run: npx playwright test --grep @smoke

    # Automated deployment of test reports to GitHub Pages
    - name: Deploy Test Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@://github.com'
