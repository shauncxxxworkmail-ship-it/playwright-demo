name: Playwright Tests with Automated Reporting
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 💡 Grant cloud servers permission to deploy static web pages.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 💡 Execute our complete test cases.
    - name: Run Playwright tests
      run: npx playwright test

    # 💡 Key highlight: Regardless of whether the test succeeds or fails, the latest HTML report will be published to the gh-pages branch.
    - name: Deploy Test Report to GitHub Pages
      if: always() # Ensure that reports are uploaded even when tests fail, facilitating remote asynchronous troubleshooting.
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@://github.com'

